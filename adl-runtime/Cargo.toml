[package]
name = "adl-runtime"
version = "0.91.7"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "CSM runtime contracts and component topology for ADL"

[lib]
name = "adl_runtime"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
serde_jcs = "0.2"
