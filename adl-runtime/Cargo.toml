[package]
name = "adl-runtime"
version = "0.92.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "CSM runtime contracts and component topology for ADL"

[lib]
name = "adl_runtime"
path = "src/lib.rs"

[features]
internal-test-fixtures = []

[[test]]
name = "distributed_runtime_transport"
path = "tests/distributed_runtime_transport.rs"
required-features = ["internal-test-fixtures"]

[[test]]
name = "distributed_observatory_authority_projection"
path = "tests/distributed_observatory_authority_projection.rs"
required-features = ["internal-test-fixtures"]

[dependencies]
adl-resilience = { path = "../adl-resilience" }
adl-runtime-kernel = { path = "../adl-runtime-kernel" }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
ed25519-dalek = "3"
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
openraft = { version = "=0.9.21", features = ["serde", "storage-v2"] }
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rand = "0.8"
redb = "4.1"
secrecy = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
serde_jcs = "0.2"
subtle = "2.6"
prost = "=0.13.5"
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "std"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["disk", "system"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
time = "0.3"
libc = "0.2"
x509-parser = "0.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
