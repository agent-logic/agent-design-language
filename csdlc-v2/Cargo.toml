[package]
name = "csdlc-v2"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[lib]
name = "csdlc_v2"
path = "src/lib.rs"

[[bin]]
name = "csdlc-edit"
path = "src/bin/csdlc-edit.rs"

[[bin]]
name = "csdlc-doctor"
path = "src/bin/csdlc-doctor.rs"

[dependencies]
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
markdown = "1.0.0"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

