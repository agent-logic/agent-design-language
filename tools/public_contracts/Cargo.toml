[package]
name = "adl-public-contracts"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde_json = "1"
serde = "1"
tempfile = "3"
sha2 = "0.10"
regex = "1"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
toml = "0.8"

[[bin]]
name = "adl-public-contracts"
path = "src/main.rs"

[[bin]]
name = "adl-owner-probe"
path = "src/owner_probe.rs"

[[bin]]
name = "adl-argument-probe"
path = "src/argument_probe.rs"
