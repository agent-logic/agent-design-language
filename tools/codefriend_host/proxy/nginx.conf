# Dedicated beta host configuration, not an include in an unknown default site.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
# Nginx error messages can include request URIs (OAuth codes). Do not persist
# request-bearing logs; systemd process state remains an operational signal.
error_log /dev/null;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 4m;
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 20s;
    keepalive_timeout 15s;
    limit_conn_zone $server_name zone=beta_connections:1m;

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name beta.codefriend.ai;
        return 308 https://beta.codefriend.ai$request_uri;
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        # A valid SNI handshake can later select this default by HTTP Host.
        return 421;
    }
    server {
        listen 443 ssl;
        server_name beta.codefriend.ai;
        ssl_certificate /etc/codefriend/tls/fullchain.pem;
        ssl_certificate_key /etc/codefriend/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        limit_conn beta_connections 128;
        # Also reject a mismatched HTTP Host after valid SNI selection.
        if ($host != beta.codefriend.ai) { return 421; }
        location / {
            # Every route, including /v1/operations, enters website authorization.
            # There is intentionally no upstream to the gateway's 43155 port.
            proxy_pass http://127.0.0.1:43156;
            proxy_http_version 1.1;
            proxy_set_header Host beta.codefriend.ai;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host beta.codefriend.ai;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            # Preserve Cookie, Authorization, Origin and X-CSRF-Token unchanged.
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_ignore_headers X-Accel-Buffering;
            proxy_max_temp_file_size 0;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_connect_timeout 3s;
            proxy_send_timeout 20s;
            proxy_read_timeout 75s;
        }
    }
}
