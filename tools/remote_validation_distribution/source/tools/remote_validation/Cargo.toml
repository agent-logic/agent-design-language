[package]
name = "adl-remote-validation"
version = "0.92.1"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Portable bounded validation request and result contract for ADL"

[[bin]]
name = "adl-remote-validation"
path = "src/bin/adl-remote-validation.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
