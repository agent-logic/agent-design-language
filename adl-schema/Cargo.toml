[package]
name = "adl-schema"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Portable provider and model identity wire contracts; declaration syntax is not execution authority"
readme = "README.md"
include = ["src/**", "schemas/**", "fixtures/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
url = "2"
