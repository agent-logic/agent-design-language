version: "0.5"
providers: {local: {type: ollama}}
agents: {worker: {provider: local, model: test}}
tasks:
  left: {prompt: {user: "left"}}
  right: {prompt: {user: "right"}}
  join: {prompt: {user: "join"}}
patterns:
  - id: p
    type: fork_join
    fork:
      branches:
        - {id: b, steps: [right]}
        - {id: a, steps: [left]}
    join: {step: join}
run: {name: branch-order, pattern_ref: p}
