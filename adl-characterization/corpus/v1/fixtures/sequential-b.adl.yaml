version: "0.5"
providers: {local: {type: ollama}}
agents: {worker: {provider: local, model: test}}
tasks:
  first: {prompt: {user: "first"}}
  second: {prompt: {user: "second"}}
run:
  name: sequential-order
  workflow:
    kind: sequential
    steps:
      - {id: second, agent: worker, task: second}
      - {id: first, agent: worker, task: first}
