name: ci

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  adl_path_policy:
    name: adl-path-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust_required: ${{ steps.path-policy.outputs.rust_required }}
      coverage_required: ${{ steps.path-policy.outputs.coverage_required }}
      ci_contracts_required: ${{ steps.path-policy.outputs.ci_contracts_required }}
      ci_path_policy_contracts_required: ${{ steps.path-policy.outputs.ci_path_policy_contracts_required }}
      runtime_v3_fast_required: ${{ steps.path-policy.outputs.runtime_v3_fast_required }}
      csdlc_v2_standalone_required: ${{ steps.path-policy.outputs.csdlc_v2_standalone_required }}
      adl_v2_standalone_required: ${{ steps.path-policy.outputs.adl_v2_standalone_required }}
      required_runner: ${{ steps.required-runner.outputs.runner }}
      reason: ${{ steps.path-policy.outputs.reason }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: path-policy
        run: |
          bash adl/tools/ci_path_policy.sh \
            --event-name "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --ref "${{ github.ref }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Select the sole required runner
        id: required-runner
        env:
          HEAVY_RUNNER: ${{ vars.ADL_HEAVY_RUNNER || 'adl-ubuntu-24.04-16core' }}
          RUST_REQUIRED: ${{ steps.path-policy.outputs.rust_required }}
          COVERAGE_REQUIRED: ${{ steps.path-policy.outputs.coverage_required }}
          CI_CONTRACTS_REQUIRED: ${{ steps.path-policy.outputs.ci_contracts_required }}
          RUNTIME_V3_REQUIRED: ${{ steps.path-policy.outputs.runtime_v3_fast_required }}
          CSDLC_V2_REQUIRED: ${{ steps.path-policy.outputs.csdlc_v2_standalone_required }}
          ADL_V2_REQUIRED: ${{ steps.path-policy.outputs.adl_v2_standalone_required }}
        run: |
          if [ "$RUST_REQUIRED" = true ] || [ "$COVERAGE_REQUIRED" = true ] || \
             [ "$CI_CONTRACTS_REQUIRED" = true ] || [ "$RUNTIME_V3_REQUIRED" = true ] || \
             [ "$CSDLC_V2_REQUIRED" = true ] || [ "$ADL_V2_REQUIRED" = true ]; then
            echo "runner=$HEAVY_RUNNER" >> "$GITHUB_OUTPUT"
          else
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce workflow topology
        run: ruby adl/tools/validate_ci_workflow_policy.rb

  adl_ci:
    name: adl-ci
    needs: adl_path_policy
    runs-on: ${{ needs.adl_path_policy.outputs.required_runner }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        if: needs.adl_path_policy.outputs.rust_required == 'true' || needs.adl_path_policy.outputs.runtime_v3_fast_required == 'true' || needs.adl_path_policy.outputs.csdlc_v2_standalone_required == 'true' || needs.adl_path_policy.outputs.adl_v2_standalone_required == 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: C-SDLC v2 required validation
        if: needs.adl_path_policy.outputs.csdlc_v2_standalone_required == 'true'
        run: |
          cargo test --locked --manifest-path csdlc-v2/Cargo.toml
          cargo fmt --manifest-path csdlc-v2/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path csdlc-v2/Cargo.toml --all-targets -- -D warnings

      - name: ADL v2 required validation
        if: needs.adl_path_policy.outputs.adl_v2_standalone_required == 'true'
        run: bash adl/tools/run_adl_v2_standalone.sh

      - name: Runtime v3 required validation
        if: needs.adl_path_policy.outputs.runtime_v3_fast_required == 'true'
        run: |
          cargo test --manifest-path adl-runtime-kernel/Cargo.toml
          cargo clippy --manifest-path adl-runtime-kernel/Cargo.toml --all-targets -- -D warnings

      - name: Rust required validation
        if: needs.adl_path_policy.outputs.rust_required == 'true' && needs.adl_path_policy.outputs.runtime_v3_fast_required != 'true'
        run: |
          cargo fmt --manifest-path adl/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path adl/Cargo.toml --all-targets -- -D warnings
          bash adl/tools/run_pr_fast_test_lane.sh

      - name: CI contract validation
        if: needs.adl_path_policy.outputs.ci_contracts_required == 'true'
        run: |
          ruby adl/tools/validate_ci_workflow_policy.rb
          ruby adl/tools/test_validate_ci_workflow_policy.rb
          bash adl/tools/test_ci_runtime_contracts.sh

      - name: Documentation command validation
        run: bash adl/tools/check_release_notes_commands.sh

  adl_coverage:
    name: adl-coverage
    needs:
      - adl_path_policy
      - adl_ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record required coverage disposition
        env:
          COVERAGE_REQUIRED: ${{ needs.adl_path_policy.outputs.coverage_required }}
          POLICY_REASON: ${{ needs.adl_path_policy.outputs.reason }}
        run: |
          printf 'coverage_required=%s\npolicy_reason=%s\n' "$COVERAGE_REQUIRED" "$POLICY_REASON"
          echo "Coverage producers are out-of-band and do not materialize on ordinary PRs."
