name: Remote validation distribution
on:
  pull_request:
    paths:
      - 'tools/remote_validation_distribution/**'
      - 'docs/milestones/v0.93.1/repository-decomposition/remote-validation-1213/**'
      - '.github/workflows/remote-validation-distribution.yml'
  push:
    branches: [main]
    paths:
      - 'tools/remote_validation_distribution/**'
      - '.github/workflows/remote-validation-distribution.yml'
permissions:
  contents: read
jobs:
  artifact-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.92.0
      - name: Verify frozen export and reject invalid distributions
        run: cargo test --offline --locked --manifest-path tools/remote_validation_distribution/Cargo.toml --test distribution
      - name: Populate public registry cache for the pinned consumer
        run: cargo fetch --locked --manifest-path tools/remote_validation/Cargo.toml
      - name: Execute the offline artifact consumer
        run: python3 -B tools/remote_validation_distribution/verify_consumer.py --output "$RUNNER_TEMP/remote-validation-consumer"
