name: nightly-coverage-ratchet

# Explicit manual qualification; this workflow has no scheduled trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-coverage-ratchet:
    runs-on: ubuntu-latest
    env:
      COVERAGE_OUTPUT: ${{ runner.temp }}/nightly-public-coverage
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install pinned coverage producer
        run: cargo install cargo-llvm-cov --locked --version 0.8.2

      - name: Run public quality gates
        run: |
          set -euo pipefail
          cargo fmt --manifest-path adl/Cargo.toml --package adl -- --check
          cargo clippy --locked --manifest-path adl/Cargo.toml --package adl --lib --bins \
            --test adl_tests --test resolve_tests --test schema_tests --test public_process \
            --test issue_327_removed_tooling --test public_observation -- -D warnings
          cargo test --locked --manifest-path adl/Cargo.toml --package adl --doc
          for manifest in adl-schema/Cargo.toml adl-uts/Cargo.toml adl-v2/crates/adl-language/Cargo.toml adl-v2/crates/adl-compiler/Cargo.toml adl-legacy-contracts/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
            cargo test --locked --manifest-path "$manifest" --doc
          done

      - name: Measure retained public source
        id: coverage
        run: python3 -B tools/public_adl/coverage.py --mode full --output "$COVERAGE_OUTPUT"

      - name: Build nightly report
        if: always()
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          python3 -B - <<'PYREPORT'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['COVERAGE_OUTPUT'])
          result = output / 'result.json'
          lines = ['# Public ADL coverage report', '',
                   '- Invocation: manual workflow dispatch',
                   '- Coverage step: ' + os.environ['COVERAGE_OUTCOME'],
                   '- Required floors: 90% aggregate and 80% per measured file', '']
          if result.is_file():
              data = json.loads(result.read_text())
              assert data['schema'] == 'adl.public_coverage.v1' and data['mode'] == 'full'
              assert data['line_count'] > 0
              assert data['thresholds']['full_file'] == 80 and data['thresholds']['full_aggregate'] == 90
              lines += ['- Source: `' + data['source_head'] + '`',
                        '- Measured lines: ' + str(data['covered_lines']) + '/' + str(data['line_count']),
                        '- Total coverage: %.2f%%' % (100 * data['covered_lines'] / data['line_count']),
                        '', '## Coverage failures']
              lines += ['- ' + failure for failure in data['failures']] or ['- None']
              lines += ['', '## Lowest measured files']
              measured = [(path, row) for path, row in data['files'].items() if row['count'] > 0]
              for path, row in sorted(measured, key=lambda item: (item[1]['covered'] / item[1]['count'], item[0]))[:10]:
                  lines.append('- `%s`: %d/%d (%.2f%%)' % (path, row['covered'], row['count'], 100 * row['covered'] / row['count']))
              failed = data['status'] != 'passed' or bool(data['failures'])
          else:
              lines += ['## Blocker', '- Coverage result was not produced; inspect retained execution logs.']
              failed = True
          report = Path(os.environ['RUNNER_TEMP']) / 'nightly-public-coverage-report.md'
          report.write_text('\n'.join(lines) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(report.read_text())
          if failed:
              raise SystemExit(1)
          PYREPORT

      - name: Retain nightly coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-coverage-ratchet-report
          path: |
            ${{ runner.temp }}/nightly-public-coverage-report.md
            ${{ runner.temp }}/nightly-public-coverage/result.json
            ${{ runner.temp }}/nightly-public-coverage/executions.json
            ${{ runner.temp }}/nightly-public-coverage/*/summary.json
            ${{ runner.temp }}/nightly-public-coverage/*/coverage.lcov
            ${{ runner.temp }}/nightly-public-coverage/*/*.log
          if-no-files-found: error
          retention-days: 7
