[package]
name = "adl-legacy-contracts"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Portable legacy ADL document, planning and wire contracts; Runtime admission remains separate"
readme = "README.md"
include = ["src/**", "schemas/**", "fixtures/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
serde_yaml = "0.9"
jsonschema = { version = "0.17", default-features = false }
once_cell = "1"
adl-schema = { version = "=0.1.0", path = "../adl-schema" }

[dev-dependencies]
tempfile = "3"
