<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognitive Spacetime cover artwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --paper: oklch(98.5% 0.004 250);
    --grid: oklch(90% 0.01 250);
    --ink: oklch(15% 0.01 260);
    --blue: oklch(55% 0.2 265);
    --blue-light: #bfdbfe;
  }
  * { box-sizing: border-box; }
  html, body { width: 3000px; height: 3000px; margin: 0; overflow: hidden; }
  body {
    background-color: var(--paper);
    background-image: radial-gradient(var(--grid) 4px, transparent 4px);
    background-size: 66px 66px;
    color: var(--ink);
    font-family: "Plus Jakarta Sans", sans-serif;
  }
  main { position: relative; width: 100%; height: 100%; padding: 230px 240px; }
  .eyebrow { color: var(--blue); font-size: 54px; font-weight: 800; text-transform: uppercase; }
  h1 { max-width: 2300px; margin: 54px 0 0; font-size: 270px; line-height: 1.02; font-weight: 800; letter-spacing: 0; }
  h1 span { color: var(--blue); }
  .stage { position: absolute; left: 180px; right: 180px; bottom: 165px; height: 1300px; }
  .stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 300px; border-top: 30px solid var(--blue); background: var(--ink); }
  .robot { position: absolute; bottom: 205px; width: 640px; height: 900px; z-index: 2; }
  .robot.one { left: 80px; }
  .robot.two { left: 50%; transform: translateX(-50%); }
  .robot.three { right: 80px; }
  .mic { position: absolute; left: 50%; bottom: 230px; width: 265px; transform: translateX(-50%); z-index: 3; }
  .onair { position: absolute; left: 110px; bottom: 74px; z-index: 4; padding: 30px 54px; border: 10px solid var(--blue); border-radius: 80px; color: var(--blue); font-size: 55px; font-weight: 800; }
  .brand { position: absolute; right: 110px; bottom: 92px; z-index: 4; color: white; font-size: 44px; font-weight: 700; }
</style>
</head>
