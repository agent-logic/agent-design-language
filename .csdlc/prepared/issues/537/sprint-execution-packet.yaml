child_goal_rule: Each child session reads AGENTS.md, validates current dependency truth, binds its exact FastWork worktree with typed csdlc-bind, and creates an issue-bound goal naming Sprint 9, the child issue, and the bounded objective before implementation.
watcher_policy: Waiting on a predecessor, review, CI, merge, or typed terminal reconciliation is monitored rather than treated as completion.
pvf_notes:
  issue_local_proof: Each child owns its focused proof and exact-revision evidence.
  parallel_validation_lanes: Independent read-only validation may run concurrently, but implementation ordering remains sequential.
  serial_validation_gates: Provider shadow follows #514; admission follows all 13 roots; quality, docs, and publication-candidate work then advance one at a time.
  reusable_proof_criteria: Reuse only exact-digest, exact-revision, redacted evidence named as a read-only input by the consuming child.
  fail_closed_rule: Missing targets, zero-test filters, stale evidence, dependency drift, ambiguous identity, or non-proving results block the affected child.
review_policy:
  child_review: one bounded exact-head review before each child publication
  sprint_review: one integrated review after all current members are terminal
