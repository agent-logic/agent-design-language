child_goal_rule: Each child session reads AGENTS.md, validates current dependency truth, binds its exact FastWork worktree with typed csdlc-bind, and creates an issue-bound goal naming Sprint 8, the child issue, and the bounded objective before implementation.
watcher_policy: Every active or waiting child has an issue-local watcher; waiting on CI, review, merge, operator authority, or a serial gate is monitored rather than treated as sprint completion.
pvf_notes:
  issue_local_proof: Each child owns its focused deterministic or native proof and records deferred hosted or provider proof truthfully.
  parallel_validation_lanes: Independent child proof may run concurrently only when write sets and external resources do not overlap.
  serial_validation_gates: Production feed proof follows episode packages; directory proof follows feed; OBS-B remains deferred behind OBS-A and backlog Unity authority.
  reusable_proof_criteria: Reuse only exact-digest, exact-revision, redacted evidence named as a read-only dependency by the consuming child.
  fail_closed_rule: Missing targets, zero-test filters, stale evidence, dependency drift, operator-authority gaps, or mock substitution block the affected child.
review_policy:
  child_review: one bounded exact-head review before each child publication
  sprint_review: one integrated review after all current members are terminal or have explicit accepted dispositions
  follow_up_policy: post_sprint_follow_on unless explicitly marked must_land_before_sprint_close
closeout_rule: Close issue 536 only after exact current membership reconciliation, integrated review, ancestral reviewed-green merges for completed implementation children, truthful blocked/deferred dispositions, and typed umbrella finish.
