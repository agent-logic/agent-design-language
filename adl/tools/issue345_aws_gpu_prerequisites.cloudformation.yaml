AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal pre-provisioned safety resources for the optional ADL issue 345 AWS GPU proof

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  ArtifactBucket:
    Type: String
Resources:
  NoIngressSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: adl-issue345-no-ingress
      GroupDescription: No-ingress security group for bounded ADL issue 345 GPU proof
      VpcId: !Ref VpcId
      SecurityGroupIngress: []
      Tags:
        - Key: adl:issue
          Value: '345'

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ADLIssue345GpuProofRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ADLIssue345ArtifactReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadOnlyVersionedShepherdArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/shepherd/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: ADLIssue345GpuProofProfile
      Roles:
        - !Ref InstanceRole

  DeadlineReaperRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ADLIssue345GpuDeadlineReaperRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReapOnlyManagedIssue345Instances
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ec2:ResourceTag/adl:issue: '345'
                    ec2:ResourceTag/adl:managed-deadline: 'true'

  DeadlineReaperFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: adl-issue345-gpu-deadline-reaper
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt DeadlineReaperRole.Arn
      Timeout: 30
      Environment:
        Variables:
          ADL_ISSUE: '345'
      Code:
        ZipFile: |
          import datetime
          import os
          import boto3

          def handler(_event, _context):
              now = int(datetime.datetime.now(datetime.timezone.utc).timestamp())
              ec2 = boto3.client("ec2")
              response = ec2.describe_instances(Filters=[
                  {"Name": "tag:adl:issue", "Values": [os.environ["ADL_ISSUE"]]},
                  {"Name": "tag:adl:managed-deadline", "Values": ["true"]},
                  {"Name": "instance-state-name", "Values": ["pending", "running", "stopping", "stopped"]},
              ])
              overdue = []
              for reservation in response["Reservations"]:
                  for instance in reservation["Instances"]:
                      tags = {tag["Key"]: tag["Value"] for tag in instance.get("Tags", [])}
                      deadline = tags.get("adl:deadline-epoch", "")
                      if deadline.isdigit() and int(deadline) <= now:
                          overdue.append(instance["InstanceId"])
              if overdue:
                  ec2.terminate_instances(InstanceIds=overdue)
              return {"terminated_count": len(overdue)}

  DeadlineReaperRule:
    Type: AWS::Events::Rule
    Properties:
      Name: adl-issue345-gpu-deadline-reaper
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: issue345-deadline-reaper
          Arn: !GetAtt DeadlineReaperFunction.Arn

  DeadlineReaperPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DeadlineReaperFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DeadlineReaperRule.Arn

Outputs:
  SecurityGroupId:
    Value: !Ref NoIngressSecurityGroup
  DeadlineReaperFunctionName:
    Value: !Ref DeadlineReaperFunction
  InstanceProfileName:
    Value: !Ref InstanceProfile
