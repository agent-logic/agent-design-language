AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ADL issue #268 reproducible single-host Runtime qualification environment.
  Creates one On-Demand r7i.2xlarge, attaches an existing warm Runtime EBS
  volume, and exposes an SSM-managed execution surface.

Parameters:
  RunId:
    Type: String
    AllowedPattern: '^issue268-[A-Za-z0-9._-]+$'
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet in AvailabilityZone with SSM and S3 connectivity.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC containing SubnetId; used for the template-owned no-ingress group.
  RuntimeVolumeId:
    Type: String
    AllowedPattern: '^vol-[0-9a-f]{8,17}$'
    Description: Fully hydrated persistent Runtime volume in AvailabilityZone.
  SshPublicKey:
    Type: String
    AllowedPattern: '^ssh-ed25519 [A-Za-z0-9+/=]+(?: [A-Za-z0-9._@-]+)?$'
    Description: Operator public key installed for break-glass SSH access.
  SshIngressCidr:
    Type: String
    AllowedPattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/32$'
    Description: Current operator public IPv4 address restricted to a single host.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  BootstrapBucket:
    Type: String
    Default: adl-shepherd-model-artifacts-b05e1f4379b5c745-us-west-2
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  BootstrapPrefix:
    Type: String
    Default: shepherd/
    AllowedPattern: '^shepherd/[A-Za-z0-9._/-]*$'

Resources:
  RuntimeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'SSM Runtime host with operator-only SSH for ${RunId}'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshIngressCidr
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: adl:issue
          Value: "268"
        - Key: adl:run_id
          Value: !Ref RunId

  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: Issue268ImmutableBootstrapRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadPinnedBootstrapObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BootstrapBucket}/${BootstrapPrefix}*'
      Tags:
        - Key: adl:issue
          Value: "268"
        - Key: adl:run_id
          Value: !Ref RunId

  RuntimeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref RuntimeRole]

  RuntimeHost:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      ImageId: !Ref AmiId
      InstanceType: r7i.2xlarge
      IamInstanceProfile: !Ref RuntimeInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref RuntimeSecurityGroup]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 64
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub '${RunId}-runtime-host'
        - Key: adl:issue
          Value: "268"
        - Key: adl:run_id
          Value: !Ref RunId
        - Key: adl:purchase_option
          Value: on_demand
        - Key: adl:cleanup_required
          Value: "true"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          install -d -m 0755 /var/lib/adl /opt/adl-build-cache
          exec > >(tee -a /var/log/adl-issue268-bootstrap.log) 2>&1
          trap 'status=$?; printf "bootstrap_failed exit=%s\n" "$status"; touch /var/lib/adl/issue268-bootstrap-failed; exit "$status"' ERR

          dnf install -y gcc gcc-c++ make pkgconf-pkg-config openssl-devel rust cargo python3 awscli-2 git tar zstd jq xfsprogs e2fsprogs
          for required_command in cc cargo rustc python3 aws git tar zstd curl jq openssl; do
            command -v "$required_command" >/dev/null
          done

          install -d -m 0755 /opt/adl-runtime
          install -d -m 0755 /etc/adl
          install -d -m 0700 -o ec2-user -g ec2-user /home/ec2-user/.ssh
          printf '%s\n' '${SshPublicKey}' >/home/ec2-user/.ssh/authorized_keys
          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 0600 /home/ec2-user/.ssh/authorized_keys
          systemctl enable --now sshd
          cat >/etc/adl/issue268-runtime.env <<'EOF'
          ADL_RUNTIME_CONTINUITY_ROOT=/opt/adl-runtime/runtime
          ADL_ISSUE268_RETAINED_RUNTIME_ROOT=/opt/adl-runtime/runtime/state/${RunId}
          ADL_ISSUE268_BUILD_CACHE_ROOT=/opt/adl-build-cache
          ADL_ISSUE268_BOOTSTRAP_BUCKET=${BootstrapBucket}
          ADL_ISSUE268_BOOTSTRAP_PREFIX=${BootstrapPrefix}
          OLLAMA_MODELS=/opt/adl-runtime/runtime/install/current/ollama-models
          EOF
          chmod 0644 /etc/adl/issue268-runtime.env

          cat >/usr/local/sbin/adl-issue268-mount-runtime <<'EOF'
          #!/bin/bash
          set -euo pipefail
          volume_id='${RuntimeVolumeId}'
          volume_serial=$(printf '%s' "$volume_id" | tr -d -)
          device=$(lsblk -ndo NAME,SERIAL | awk -v expected="$volume_serial" '$2 == expected { print "/dev/" $1; exit }')
          [ -n "$device" ]
          [ -b "$device" ]
          filesystem=$(blkid -o value -s TYPE "$device")
          [ "$filesystem" = xfs ] || [ "$filesystem" = ext4 ]
          uuid=$(blkid -o value -s UUID "$device")
          [ -n "$uuid" ]
          grep -qF "UUID=$uuid /opt/adl-runtime " /etc/fstab || printf 'UUID=%s /opt/adl-runtime %s defaults,nofail 0 2\n' "$uuid" "$filesystem" >>/etc/fstab
          mountpoint -q /opt/adl-runtime || mount /opt/adl-runtime
          if [ "$filesystem" = xfs ]; then
            xfs_growfs /opt/adl-runtime
          else
            resize2fs "$device"
          fi
          test -d /opt/adl-runtime/runtime/install
          touch /var/lib/adl/issue268-bootstrap-ready
          EOF
          chmod 0755 /usr/local/sbin/adl-issue268-mount-runtime

          cat >/etc/systemd/system/adl-issue268-runtime-volume.service <<'EOF'
          [Unit]
          Description=Mount the retained ADL issue 268 Runtime volume
          After=local-fs.target
          # Disable rate limiting: the EBS attachment is a separate
          # CloudFormation resource and this unit must retry until it appears.
          StartLimitIntervalSec=0

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/adl-issue268-mount-runtime
          Restart=on-failure
          RestartSec=5
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable adl-issue268-runtime-volume.service
          systemctl start --no-block adl-issue268-runtime-volume.service
          systemctl enable --now amazon-ssm-agent
          for attempt in $(seq 1 450); do
            if test -f /var/lib/adl/issue268-bootstrap-ready \
                && mountpoint -q /opt/adl-runtime \
                && test -d /opt/adl-runtime/runtime/install; then
              exit 0
            fi
            sleep 2
          done
          systemctl status adl-issue268-runtime-volume.service --no-pager || true
          journalctl -u adl-issue268-runtime-volume.service -n 200 --no-pager || true
          exit 1

  RuntimeVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      # EC2 requires a conventional attachment API name. Nitro exposes the
      # volume under an unrelated NVMe name; bootstrap resolves its EBS serial.
      Device: /dev/sdf
      InstanceId: !Ref RuntimeHost
      VolumeId: !Ref RuntimeVolumeId

Outputs:
  InstanceId:
    Value: !Ref RuntimeHost
  RuntimeVolumeId:
    Value: !Ref RuntimeVolumeId
  RuntimeMountPath:
    Value: /opt/adl-runtime
  BuildCachePath:
    Value: /opt/adl-build-cache
  BootstrapLog:
    Value: /var/log/adl-issue268-bootstrap.log
  SsmReadyMarker:
    Value: /var/lib/adl/issue268-bootstrap-ready
    Description: Qualification must wait for this marker; stack completion alone is insufficient.
  SsmReadinessCommand:
    Value: test -f /var/lib/adl/issue268-bootstrap-ready && mountpoint -q /opt/adl-runtime
