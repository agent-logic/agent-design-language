schema: adl.long_lived_agent_spec.v1
agent_instance_id: backpressure-agent
display_name: Backpressure Agent
state_root: state
workflow:
  kind: demo_adapter
  name: wp07_backpressure_probe
  run_args:
    provider_id: local_ollama
    model: gemma4:latest
heartbeat:
  interval_secs: 1
  max_cycles: 2
  stale_lease_after_secs: 60
safety:
  allow_network: false
  allow_broker: false
  allow_filesystem_writes_outside_state_root: false
  allow_real_world_side_effects: false
  require_public_artifact_sanitization: true
  financial_advice: false
  max_cycle_runtime_secs: 120
  max_consecutive_failures: 2
checkpoint:
  interval_secs: 1
  allow_agent_requested: true
  min_request_interval_secs: 1
memory:
  namespace: smoke/backpressure-agent
  write_policy: append_only
