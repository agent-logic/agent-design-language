  - The #4660 gate preserves fail-closed activation semantics and does not claim final v0.92 readiness.
  - Pre-PR subagent review found lifecycle-card truth drift and stale SRP review truth; both were fixed and revalidated before publication.
  - Live WebSocket runtime API integration remains backlog-only until promoted; no new issue was opened.
