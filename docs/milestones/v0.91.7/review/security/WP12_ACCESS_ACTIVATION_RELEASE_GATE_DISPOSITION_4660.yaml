focused_validation_run: >
  Focused local proof passed after review fixes and rebase: python3
  adl/tools/validate_wp12_access_activation_gate_4660.py --access-gate
  docs/milestones/v0.91.7/review/security/wp12_access_activation_gate_4660.json
  --parent-gate
  docs/milestones/v0.91.7/review/security/wp12_security_cav_gate_4656.json;
