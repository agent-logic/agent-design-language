  - .github/workflows/aws-spot-remote-validation.yaml
focused_validation_run: >
  Focused local proof passed: bash adl/tools/test_run_aws_spot_remote_validation_lane.sh;
  bash adl/tools/test_select_validation_lanes.sh; workflow YAML parse; git diff
  --check; and cargo test --manifest-path adl/Cargo.toml --bin
  adl-aws-remote-validation -- --nocapture.
post_merge_disposition: >
  The release-gate surface has merged. The repo now has an operator-triggered
  AWS Spot remote validation lane with dry-run default, Agent Logic account-hash
  checking, warm EBS cache flags, GitHub Actions workflow_dispatch support, and
  retained live warm-EBS proof in the #4837/#4879 proof packets.
residual_operational_requirements: >
  Paid live Spot execution remains explicit and operator-triggered. Fresh
  warm-EBS claims must still show the retained cache volume attached in the AWS
  summary, successful cleanup/termination, redacted AWS identity fields, and a
  concrete advertised git ref. GitHub repository secret/configuration setup is
  operator-managed and is not committed as repo state.
notes:
  - The release-gate surface is a new manual validation workflow, not a change to ordinary PR or push CI.
  - The workflow uses GitHub OIDC with id-token write and contents read permissions.
  - The AWS role trust is bounded to the repository's main and codex/* refs.
  - Uploaded run artifacts redact AWS identity fields before upload.
  - Current retained benchmark truth comes from the fixed builder image plus retained warm EBS cache row: 24s build, 49s test, 73s benchmark total, with remote command wall time 122s.
