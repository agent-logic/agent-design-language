- title: Implement Transaction Storage And Recovery
  objective: Make state mutation crash-consistent with one explicit commit point and recoverable projections.
  scope: Advisory locking, compare-and-swap generation/digest checks, intent records, temporary writes, fsync policy, atomic `state.json` replacement, projection regeneration, recovery classification, fault injection, and concurrent writer behavior.
  non_goals:
  - Distributed transactions, remote rollback, lock-as-ownership, multi-file atomicity claims, GitHub mutation, or cleanup of unrelated paths.
  deliverables:
  - Transaction store, recovery engine, intent schema, explicit pre-network intent commit and post-readback reconciliation protocols, interruption matrix, per-platform sync/replacement safety matrix and harness, filesystem capability policy, and concurrency fixtures. `store/transaction.rs` owns lock/CAS/stage/sync/replace commit mechanics. `store/recovery.rs` is a pure classifier plus recovery-plan builder over observed canonical state, staging files, and durable intents; it cannot write directly and executes any selected repair through the transaction API.
  acceptance_criteria:
  - Only atomic replacement of `state.json` commits authority.
  - State commits before projection replacement; post-commit projection failure is a specific repair-required result, never rollback or ambiguous authority.
  - Cards, evidence indexes, and audit views are repairable projections.
  - Stale generation/digest writers fail before commit.
  - Every injected interruption converges to the prior or new valid state.
  - A remote operation cannot begin before its typed intent and parent directory are durably synced; recovery resumes committed intents through exact readback.
  - 'An unresolved intent is authoritative only as a pending-operation journal: it blocks competing mutation, contains no lifecycle/card state, and is consumed only after exact readback commits its outcome into `state.json`.'
  - Linux, macOS, and every mutation-enabled Windows filesystem have a named, documented, fault-tested commit primitive; unproven Windows mutation fails closed while compile and read-only support remain available.
  - An injected platform-capability fixture proves the Windows fail-closed path and stable `unsupported_platform_mutation` error on every CI host; native Windows CI separately proves any mutation-enabled primitive.
  - Locks protect transaction integrity without becoming lifecycle authority.
  validation_proof: Fault injection at every write/sync/rename boundary, parallel writer stress, repeated recovery idempotency, disk-full/read-only fixtures, and supported-filesystem tests.
  stop_conditions:
  - Recovery requires guessing, a partial projection becomes authority, remote mutation enters a local transaction, or platform semantics cannot satisfy the declared commit guarantee.
  source_refs:
  - ".adl/docs/TBD/CSDLC_V3_GH_INSPIRED_RUST_ARCHITECTURE.md#v3-08"
