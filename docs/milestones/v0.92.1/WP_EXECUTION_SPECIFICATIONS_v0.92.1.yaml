  acceptance_criteria:
  - Every state/command pair has an explicit allowed or rejected outcome.
  - The compiler enforces exhaustive closed-state handling.
  - Branch/worktree topology is the only local ownership authority.
  - Review staleness, publication gates, terminal truth, and cleanup eligibility remain fail-closed.
  - Every accepted recovery transition preserves a reachable typed correction or typed terminal-disposition command; no supported state is a lifecycle dead end and no abstract operator-required sink satisfies reachability.
  - The generated transition table accepts `review recover` only from `reviewed`, `published`, or `merge_ready`, returns to `implemented`, rejects `merged` and `closed_out`, and proves the matrix-declared atomic invalidations.
  - Removing or changing any authorization predicate causes mutation/property tests to fail, including correction invalidation and stale-CAS predicates.
  - Cleanup eligibility requires committed `closed_out` state and a retained terminal receipt; remote merge observation alone is insufficient.
  validation_proof: Complete transition-and-correction table tests, graph reachability for every supported recovery state, property tests for invariants and idempotency, mutation testing of authorization and rejection predicates, and normalized v2 parity cases including every retained v2 recovery defect.
  stop_conditions:
  - A transition needs ambient I/O, an unknown state falls through, or claims, leases, heartbeats, or protected-path ledgers reappear as authority.
