- objective: Migrate production AWS infrastructure into the Agent Logic business account with DNS, TLS, email, storage, monitoring, workload, and rollback proof.
  scope: Agent Logic business AWS identity, Route53, ACM, SES, S3, CloudFront, compute, IAM, monitoring, backups, budgets, account contacts, and temporary migration resources.
  deliverables:
  - Service-by-service infrastructure migration manifest and company-account readback.
  - Cutover and rollback receipts for DNS, certificates, email, storage, delivery, monitoring, and workloads.
  acceptance_criteria:
  - Every AWS operation verifies the approved Agent Logic business account and uses the permanent business profile.
  - Public TLS uses ACM or another publicly trusted issuer; production paths contain no self-signed certificate.
  - DNS, email, storage, CDN, workload, monitoring, backup, budget, and rollback checks pass from company authority.
  - Temporary resources are inventoried, tagged, bounded, and deleted with provider readback after each phase.
  non_goals:
  - Using the founder personal AWS account
  - Introducing a second permanent IAM profile
  - Leaving temporary resources running after failure
  validation_proof: Account identity, Terraform plan/apply, DNS, TLS, SES, S3/CloudFront, workload, monitoring, backup, budget, rollback, and cleanup receipts.
  stop_conditions:
  - AWS resolves to a non-business account
