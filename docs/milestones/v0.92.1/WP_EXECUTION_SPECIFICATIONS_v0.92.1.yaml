- objective: Move Terraform state, CI/CD, deployment identity, rollback, and operational runbook authority to company-controlled systems.
  scope: Remote state and locks, OIDC and deployment roles, GitHub environments, secrets by name, workflow permissions, release and rollback commands, monitoring escalation, and operator runbooks.
