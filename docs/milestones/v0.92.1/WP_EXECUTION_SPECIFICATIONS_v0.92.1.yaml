- title: Implement The Pure Lifecycle Kernel
  objective: Encode lifecycle transitions and authorization predicates as a pure, exhaustive, side-effect-free state machine.
  scope: Phases, transition commands, preconditions, topology ownership, design/readiness/review/publication/terminal predicates, capability-derived field authorization, recovery reachability, idempotent outcomes, and stable domain errors.
