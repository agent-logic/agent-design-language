- objective: Establish company-controlled billing, administration, MFA, recovery, vault, break-glass, and custody for every critical service.
  scope: Company identities, billing profiles, secure MFA, recovery channels, vault custody, break-glass procedure, least privilege, role separation, and founder-dependency removal.
