- title: Implement PR Mutation And Foreground Watch
  objective: Implement idempotent PR publication and bounded foreground waiting over the reviewed GitHub adapter.
  scope: Mode-bound publication intents, issue/PR/comment mutation, operation markers, exact linkage readback, `pr publish`, `pr watch`, check/review/mergeability updates, signal cancellation, and optional explicitly authorized merge policy.
  non_goals:
  - Finish, cleanup, detached watchers, polling daemons, implicit merge, remote rollback, or terminal issue closure reconciliation.
  deliverables:
  - Typed mutation operations, durable intent integration, publication command with explicit `closing | part_of` linkage selection, mode-bound publication evidence and reconciliation, foreground watch with 30-minute default, 24-hour maximum, 15-second default poll interval and stderr progress, idempotency/readback fixtures, and bounded live publication canary.
  acceptance_criteria:
  - No remote mutation begins before its durable intent commit.
  - Every mutation is idempotent and verified by exact remote readback.
  - "`closing` requires the exact closing relation; `part_of` requires the exact non-closing relation and proves the target issue remains open after PR publication and checkpoint merge observation."
  - Same-repository shorthand normalizes to a qualified identity, while split repositories reject unqualified linkage in either mode.
  - "`pr watch` is foreground, cancellable by root signals, bounded, and leaves no persistent job or unjoined task."
  - Fake-adapter tests prove that a `part_of` watch cannot report checkpoint-ready unless exact REST issue readback still observes the qualified target issue open; closed, missing, stale, or contradictory observations produce reconciliation-required.
  - Every watch sleep and network await is selected against root cancellation; cancellation drains and joins the watch scope before exit 130.
  - Default and overridden timeout/poll values remain within the V3-01 bounds and timeout exits without a persistent job or unjoined task.
  - If `now + max(poll_interval, retry_after)` exceeds the fixed deadline, watch exits immediately without sleeping past the deadline.
  - Merge occurs only when the approved explicit policy and operator authority are both present.
  validation_proof: Intent crash matrix, duplicate-marker tests, same- and split-repository `closing | part_of` positive/negative matrices, missing/mixed/ ambiguous/wrong-target linkage negatives, evidence/reconciliation fixtures, watch cancellation and timeout tests, stale-head negatives, merge-policy tests, and bounded live canaries for both linkage modes.
  stop_conditions:
  - Mutation lacks a resumable intent, linkage mode or target is not durable, readback can conflate `part_of` with closing, watch detaches, exact readback is unavailable, merge becomes implicit, or cancellation leaves work running.
