- title: Implement Exact Review And Publication Gates
  objective: Implement independent exact-revision review assignment, result recording, staleness, finding disposition, and publication authorization.
  scope: "`review assign/record/recover/status`, structurally bound reviewer principals, independence enforcement and policy-only limitation handling, exact scope/revision identity, findings and dispositions, non-substantive change proof, typed recovery provenance and invalidation, mode-bound publication intent, and fail-closed review guard."
  non_goals:
  - Hosting model providers, merging PRs, watching checks, terminal finish, cleanup, or treating review prose as state authority.
  deliverables:
  - Review schemas, authenticated/provider-evidence reviewer principal model, independence predicate and typed override boundary, staleness classifier, finding model, `review recover` transition and command, publication guard, typed intents, mode-bound publication authorization evidence, and review fixture corpus.
  acceptance_criteria:
  - Review names exact revision, scope, reviewer, findings, and dispositions.
  - Substantive head changes stale review; non-substantive exceptions require deterministic proof.
  - "`review recover` is accepted only from `reviewed`, `published`, or `merge_ready`; it is rejected from `merged` and `closed_out`. It requires actor/reason and stale-truth provenance, returns to `implemented`, and atomically clears every dependent review, publication, readiness, and terminal field declared by the capability row before a card correction can proceed."
  - Recovery followed by a semantic card correction and fresh review is a complete executable path; direct state/card edits and abstract operator dispositions cannot satisfy it.
  - 'Both linkage modes prove the full review journey: review, publish, recover, semantic correction, re-review, and republish preserve the exact normalized target and invalidate the superseded mode-bound authorization.'
  - Publication fails closed on missing, stale, blocked, or actionable review.
  - Model/provider output is evidence input, never direct lifecycle authority.
  - Same-principal implementation/review/publication is rejected; policy-only identity cannot pass the publication gate without a named typed override.
  - Human-review publication remains fail-closed until a concrete authenticated principal observer implements the V3-04 interface; V3-12 proves this with a fake and does not depend on the V3-13 GitHub implementation.
  - Authorization consumes the V3-01 `PublicationLinkage` value, binds it to the exact reviewed revision and target issue, and rejects absent, mixed, ambiguous, or wrong-repository linkage.
  - "`PartOf` rejects a closing keyword for its target and `Closing` rejects a non-closing-only relation."
  validation_proof: Exact-head/staleness matrix, independence-policy tests, finding lifecycle tests, recover/correct/re-review positive journeys, wrong phase/provenance/invalidation negatives, non-substantive proof negatives, same/split-repository positive and negative linkage matrices, publication guard tests, and tampered-review fixtures.
  stop_conditions:
  - Review can approve an unknown revision, actionable findings can be hidden, recovery can strand a record or leave dependent truth current, publication can bypass review, linkage mode is implicit or ambiguous, or provider identity is overstated.
