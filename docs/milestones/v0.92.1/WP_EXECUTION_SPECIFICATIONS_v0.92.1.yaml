    acceptance_criteria: [Every critical asset has an owner and disposition, Private instruments remain outside Git, Redacted receipts bind accepted instruments to the asset schedule]
    owned_paths: [docs/operations/corporate/asset-register/**, docs/milestones/v0.92.1/evidence/corporate/corp-a/**]
    pvf_lanes: [asset-denominator, provenance-and-license, redaction-and-custody, diff-hygiene]
