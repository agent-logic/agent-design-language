- objective: Convert the reviewed planning-only WBS into a complete live issue wave without starting implementation.
  scope: Milestone and labels, four coordination umbrellas, all planned child issues, six-card generation, exact issue mapping, dependency graph, ownership, validators, readiness, review, and start authorization.
  deliverables:
  - Live issue and umbrella census mapped one-to-one to every planned WBS identifier.
  - Complete six-card issue packages and issue-specific designs for every live child.
  - Machine-readable readiness report proving denominator, ownership, dependency, PVF, stop-condition, and review completeness.
  acceptance_criteria:
  - Every non-deferred planned package and coordination umbrella is created exactly once with the v0.92.1 label and canonical title.
  - Every live child has six validated cards, exact owned paths, acceptance criteria, dependencies, PVF lanes and budgets, stop conditions, design review, and issue-owned validation targets.
  - 'The live issue map is generated only after readback and contains no retired #149-#190 authority.'
  - No child binds or starts until WP-01 passes independent review and receives explicit operator start authorization.
  - Creation is idempotent and rejects duplicate markers, missing issues, stale specifications, and dependency cycles.
  non_goals:
  - Implementing any child work package
  - 'Reopening retired issues #149-#190'
  - Claiming milestone execution or release readiness
  validation_proof: Exact WBS denominator, canonical issue readback, card and schema validation, dependency DAG validation, owned-path collision analysis, negative duplicate/stale-spec tests, and independent opening review.
  stop_conditions:
  - The reviewed planning package has not merged
  - Any WBS identifier lacks a complete specification
  - An issue or marker collision is detected
  - A child would begin before opening approval
  title: Open v0.92.1 and create the execution-ready issue wave
