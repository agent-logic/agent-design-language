- title: Implement Finish And Cleanup
  objective: Reconcile terminal GitHub truth and provide a separate, path-exact, fail-closed cleanup operation.
  scope: "`finish`, linkage-aware PR selection, merged/closed/checkpoint/no-PR outcomes, terminal receipts, projection reconciliation, `clean` classify/preview/remove, canonical worktree identity, dirty/live/drift predicates, and retained evidence."
  non_goals:
  - PR publication, foreground watch, merge, broad cache removal, remote rollback, or deletion before terminal reconciliation. V3-15 is scoped to the no-merge command surface. If operator Decision 10 later authorizes `finish --merge`, that path requires a separately reviewed scope and contract revision before implementation; it cannot enter this issue by interpretation.
  deliverables:
  - Finish reconciler, exact linkage-aware terminal truth table, checkpoint receipt schema that cannot imply parent closure, terminal receipt schema, typed `ExternalParentClose` disposition, cleanup classifier and remover, preview output, canonical path policy, and safety fixtures.
  acceptance_criteria:
  - Finish derives terminal truth from exact GitHub state and never creates or selects an ambiguous second PR.
  - A merged `part_of` publication records checkpoint completion without closing or terminally completing the parent issue; only a matching `closing` publication or explicit no-PR outcome can do so.
  - Successful checkpoint finish transitions `published | merge_ready` through `checkpoint_completed` to `implemented`, retains checkpoint evidence, and invalidates the prior review/publication authorization before another slice.
  - A complete acceptance journey merges multiple `part_of` checkpoints for one issue, preserves the open parent after each, then processes a later independently reviewed `closing` publication through finish and closes that exact parent without selecting any checkpoint PR as terminal authority.
  - A merged `part_of` checkpoint whose parent later closes returns `operator_required`; the separately authorized external-parent-close disposition records distinct causes and reaches terminal truth without crediting the checkpoint PR or requiring remote rollback.
  - Cleanup is a separate command after finish and defaults to preview.
  - Cleanup requires canonical candidate-path equality with the verified Git worktree root; prefix and relative matches are rejected.
  - Live, dirty, mismatched, absent, unregistered, and already-removed worktrees have distinct outcomes.
  - Build/cache directories from any other worktree are never deletion targets.
  - Cleanup requires committed `closed_out` state and its terminal receipt; a GitHub merge without local terminal reconciliation remains ineligible.
  validation_proof: Linkage-aware terminal outcome matrix, multiple checkpoint then closing journeys, close-between-merge-and-finish race and disposition tests, ambiguous/mixed-PR negatives, checkpoint/terminal receipt tamper tests, canonical/symlink/path-escape fixtures, dirty/live/drift cleanup matrix, exact deletion-list proof, and bounded end-to-end canary closeout.
  stop_conditions:
  - Finish trusts local prose over GitHub, PR selection is ambiguous, a `part_of` PR can close or terminally complete its parent, cleanup cannot prove exact path identity, or deletion scope includes another live/open worktree.
  source_refs:
  - ".adl/docs/TBD/CSDLC_V3_GH_INSPIRED_RUST_ARCHITECTURE.md#v3-15"
