    stop_conditions: [wrong_aws_account, unexpected_destructive_plan, credential_or_secret_exposure, runtime_origin_unavailable, architecture_redesign_required]
    non_goals: [customer_scale_hosting, runtime_compute_deployment, terraform_architecture_redesign, multi_tenant_observatory]
