    owned_surfaces: [milestone_adr_inventory, adr_candidates, accepted_and_rejected_decision_records, supersession_map]
    acceptance: [all_required_decisions_inventoried, every_adr_source_grounded, status_and_owners_explicit, alternatives_and_consequences_recorded, superseded_decisions_linked, no_decision_claimed_accepted_without_authority]
